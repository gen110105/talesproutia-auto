name: TaleSproutia Daily Video
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: talesproutia-daily-video
  cancel-in-progress: false
jobs:
  create-video:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out TaleSproutia
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Generate story video
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_PRIVACY_STATUS: private
        run: python story_video.py
      - name: Save generated video
        uses: actions/upload-artifact@v4
        with:
          name: talesproutia-video-${{ github.run_number }}
          path: output/
          retention-days: 7
          if-no-files-found: error
